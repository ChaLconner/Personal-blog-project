name: Keep Render Free Service Awake

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake API and verify database readiness
        shell: bash
        run: |
          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --max-time 90 \
              --retry 1 \
              --retry-delay 5 \
              --retry-all-errors \
              https://personal-blog-project-server.onrender.com/ready
          )"
          echo "$response"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.status !== "OK" || body.database !== "HEALTHY") {
              console.error("Render service is not ready", body);
              process.exit(1);
            }
          ' "$response"
